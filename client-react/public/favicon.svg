<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2A1F0A"/>
      <stop offset="100%" stop-color="#0D0B09"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5D5A5"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8B6F28"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>

  <!-- Outer gold ring -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="url(#gold)" stroke-width="0.8" opacity="0.6"/>

  <!-- Central diamond star ✦ -->
  <path d="M32 10 L34.5 29.5 L54 32 L34.5 34.5 L32 54 L29.5 34.5 L10 32 L29.5 29.5 Z"
        fill="url(#gold)"/>

  <!-- Small decorative dots at cardinal points -->
  <circle cx="32" cy="8"  r="1.2" fill="#C9A84C" opacity="0.5"/>
  <circle cx="56" cy="32" r="1.2" fill="#C9A84C" opacity="0.5"/>
  <circle cx="32" cy="56" r="1.2" fill="#C9A84C" opacity="0.5"/>
  <circle cx="8"  cy="32" r="1.2" fill="#C9A84C" opacity="0.5"/>
</svg>
